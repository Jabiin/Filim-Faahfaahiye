name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >
          flutter build apk --release
          --dart-define=TMDB_KEY=${{ secrets.TMDB_KEY }}
          --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: filim-faahfaahiye-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
